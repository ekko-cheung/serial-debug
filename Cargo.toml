[package]
name = "serial-debug"
version = "0.1.0"
edition = "2024"
description = "A cross-platform serial port debugging tool built with Rust and GPUI"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4"
unicode-segmentation = "1.13.3"

[build-dependencies]
winresource = "0.1.34"
