name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: serial-debug.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: serial-debug
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: serial-debug
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: serial-debug

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libudev-dev libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan1 libvulkan-dev libssl-dev libzstd-dev

      # Newer Xcode versions ship the Metal compiler as a separate component.
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Test
        # Tests only run natively (the x64 macOS build is cross-compiled).
        if: matrix.name != 'macos-x64'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" `
            -DestinationPath "dist/serial-debug-${{ matrix.name }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/serial-debug-${{ matrix.name }}.tar.gz" "${{ matrix.bin }}"

      - uses: actions/upload-artifact@v4
        with:
          name: serial-debug-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
